# Configuración de Nginx para MetaMapa
# Idempotente: funciona con o sin certificados SSL

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Configuración básica
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream para el frontend
    upstream frontend {
        server frontend:8080;
    }

    # Servidor HTTP (siempre activo)
    server {
        listen 80;
        server_name metamapa-dds.ddns.net _;

        # Permitir Let's Encrypt challenge (CRÍTICO para obtener certificados)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Servir HTTP (si certificados existen, se redirige a HTTPS)
        # REDIRECT_TO_HTTPS será reemplazado por entrypoint si certificados existen
        location / {
            # REDIRECT_TO_HTTPS
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /actuator/health {
            proxy_pass http://frontend;
            access_log off;
        }
    }

    # Servidor HTTPS (solo si los certificados existen)
    # Nginx ignorará este bloque si los certificados no existen
    server {
        listen 443 ssl http2;
        server_name metamapa-dds.ddns.net;

        # Certificados SSL (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/metamapa-dds.ddns.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/metamapa-dds.ddns.net/privkey.pem;

        # Configuración SSL moderna
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Límites de tamaño
        client_max_body_size 50M;

        # Proxy al frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /actuator/health {
            proxy_pass http://frontend;
            access_log off;
        }
    }
}

