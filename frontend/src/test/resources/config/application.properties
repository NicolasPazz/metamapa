# Test-only overrides (loaded on top of src/main/resources/application.properties)
# In-memory H2 database so the context tests run without MySQL
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Placeholder values for the environment variables the app expects
AGREGADOR_URL=http://localhost:65535
DINAMICA_URL=http://localhost:65535
ESTATICA_URL=http://localhost:65535
PAGINATION_PAGE_SIZE=10
USERS_SERVICE_URL=http://localhost:65535
SECURITY_ORIGIN_FILTER_ENABLED=false
