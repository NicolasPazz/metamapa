<!DOCTYPE html>
<html lang="es" th:replace="~{layout/base :: html}">
<div th:fragment="contenido">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>
  <style>
    #map {
      height: calc(100vh - 80px);
      width: 100%;
      margin-top: 20px;
    }
    /* Sobrescribir estilos por defecto de Leaflet para el popup */
    .leaflet-popup-content-wrapper {
      overflow: visible !important;
    }
    .leaflet-popup-content {
      margin: 13px 19px;
      overflow: visible !important;
      max-height: none !important;
    }
    .popup-content {
      max-width: 400px;
      overflow: visible;
    }
    .popup-content h3 {
      margin: 0 0 15px 0;
      font-size: 1.2em;
      color: #333;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
    }
    .popup-content p {
      margin: 8px 0;
      font-size: 0.9em;
      line-height: 1.4;
    }
    .popup-content strong {
      color: #555;
      font-weight: 600;
    }
    .popup-content .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }
    .popup-content .tag {
      background: #e0e0e0;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .popup-content button {
      margin-top: 15px;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 5px;
      background: var(--primary, #007bff);
      color: white;
      cursor: pointer;
      font-size: 0.9em;
      width: 100%;
    }
    .popup-content button:hover {
      opacity: 0.9;
    }
    .floating-back-button {
      position: fixed;
      top: 100px;
      right: 20px;
      z-index: 1000;
    }
    /* Estilos del carrusel para el popup del mapa */
    .popup-content .multimedia-carousel {
      margin-top: 10px;
      position: relative;
    }
    .popup-content .carousel-container {
      position: relative;
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
      background: #f9f9f9;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .popup-content .carousel-slides {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
    }
    .popup-content .carousel-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .popup-content .carousel-slide.active {
      opacity: 1;
      z-index: 1;
    }
    .popup-content .carousel-item-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    .popup-content .carousel-item-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: pointer;
      border-radius: 4px;
    }
    .popup-content .carousel-item-video {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .popup-content .carousel-item-video video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
    }
    .popup-content .carousel-item-audio {
      width: 100%;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
    }
    .popup-content .carousel-item-audio audio {
      width: 100%;
      max-width: 300px;
    }
    .popup-content .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .popup-content .carousel-btn:hover {
      background: rgba(0, 0, 0, 0.7);
    }
    .popup-content .carousel-prev {
      left: 10px;
    }
    .popup-content .carousel-next {
      right: 10px;
    }
  </style>

  <!-- Botón flotante Volver -->
  <div class="floating-back-button">
    <a href="javascript:history.back()" class="btn secondary">Volver</a>
  </div>

  <!-- Map -->
  <div id="map"></div>
  <div id="no-hechos-message" style="display: none; text-align: center; padding: 20px; margin-top: 20px;">
    <p>No hay hechos con ubicación geográfica para mostrar en el mapa.</p>
    <a th:href="@{/hechos}" class="btn primary">Volver a Hechos</a>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <script th:inline="javascript">
    /*<![CDATA[*/
    const hechos = /*[[${hechos}]]*/ [];
    const centrarEnHecho = /*[[${centrarEnHecho}]]*/ false;
    const hechoId = /*[[${hechoId}]]*/ null;
    const fuenteId = /*[[${fuenteId}]]*/ null;
    const idOrigen = /*[[${idOrigen}]]*/ null;
    const handleColeccion = /*[[${handleColeccion}]]*/ null;

    // Filtrar hechos que tienen coordenadas válidas
    const hechosConCoordenadas = hechos.filter(hecho => 
      hecho.latitud != null && 
      hecho.longitud != null && 
      !isNaN(hecho.latitud) && 
      !isNaN(hecho.longitud) &&
      hecho.latitud >= -90 && hecho.latitud <= 90 &&
      hecho.longitud >= -180 && hecho.longitud <= 180
    );

    // Inicializar mapa
    let map;
    let markers = [];

    if (centrarEnHecho && hechosConCoordenadas.length > 0) {
      // Centrar en un hecho específico
      const hecho = hechosConCoordenadas[0];
      map = L.map('map').setView([hecho.latitud, hecho.longitud], 13);
    } else if (hechosConCoordenadas.length > 0) {
      // Calcular el centro de todos los hechos
      const bounds = L.latLngBounds(
        hechosConCoordenadas.map(h => [h.latitud, h.longitud])
      );
      map = L.map('map').fitBounds(bounds);
    } else {
      // Vista por defecto (Argentina)
      map = L.map('map').setView([-34.6, -58.4], 5);
    }

    // Agregar capa de OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // Crear grupo de clusters para mejor rendimiento con muchos marcadores
    const markersCluster = L.markerClusterGroup({
      chunkedLoading: true,
      chunkInterval: 200,
      chunkDelay: 50,
      maxClusterRadius: 50,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true
    });

    // Función para construir el contenido del popup
    function construirPopupContent(hecho) {
      let popupContent = '<div class="popup-content">';
      popupContent += '<h3>' + (hecho.titulo || 'Sin título') + '</h3>';
      
      // Categoría
      if (hecho.categoria) {
        popupContent += '<p><strong>Categoría:</strong> ' + hecho.categoria + '</p>';
      }

      // Descripción completa
      if (hecho.descripcion) {
        popupContent += '<p><strong>Descripción:</strong> ' + hecho.descripcion + '</p>';
      }

      // Fecha de acontecimiento
      if (hecho.fecha_acontecimiento) {
        const fecha = new Date(hecho.fecha_acontecimiento);
        popupContent += '<p><strong>Fecha de acontecimiento:</strong> ' +
          fecha.toLocaleString('es-AR', { 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit', 
            hour: '2-digit', 
            minute: '2-digit' 
          }) + '</p>';
      }

      // Fecha de carga
      if (hecho.fecha_carga) {
        const fechaCarga = new Date(hecho.fecha_carga);
        popupContent += '<p><strong>Fecha de carga:</strong> ' +
          fechaCarga.toLocaleString('es-AR', { 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit', 
            hour: '2-digit', 
            minute: '2-digit' 
          }) + '</p>';
      }

      // Provincia
      if (hecho.provincia) {
        popupContent += '<p><strong>Provincia:</strong> ' + hecho.provincia + '</p>';
      }

      // Ubicación (coordenadas)
      if (hecho.latitud != null && hecho.longitud != null) {
        popupContent += '<p><strong>Ubicación:</strong> ' + 
          hecho.latitud.toFixed(6) + ', ' + hecho.longitud.toFixed(6) + '</p>';
      }

      // Fuente
      if (hecho.nombre_fuente) {
        let nombreFuente = hecho.nombre_fuente;
        // Eliminar prefijo "Fuente " si existe
        if (nombreFuente.startsWith('Fuente ')) {
          nombreFuente = nombreFuente.substring(7);
        }
        popupContent += '<p><strong>Fuente:</strong> ' + nombreFuente + '</p>';
      } else if (hecho.origen) {
        popupContent += '<p><strong>Fuente:</strong> ' + hecho.origen + '</p>';
      }

      // Multimedia - mostrar carrusel
      const multimedia = hecho.multimedia || hecho.contenidoMultimedia;
      if (multimedia && Array.isArray(multimedia) && multimedia.length > 0) {
        const carouselId = 'popup-carousel-' + (hecho.id || Date.now());
        popupContent += '<div class="multimedia-carousel" id="' + carouselId + '">';
        popupContent += '<div class="carousel-container">';
        
        // Preparar items del carrusel
        const items = [];
        multimedia.forEach(function(item, index) {
          let tipoRaw = item.tipoContenido || item.tipo;
          if (tipoRaw && typeof tipoRaw === 'object') {
            tipoRaw = tipoRaw.name || tipoRaw.toString();
          }
          const tipo = (tipoRaw || '').toString().toUpperCase();
          const path = item.pathArchivo || item.path || '';
          
          let fileUrl;
          if (path.startsWith('http')) {
            fileUrl = path;
          } else {
            const apiBaseUrl = getApiBaseUrl();
            fileUrl = apiBaseUrl + '/multimedia/' + encodeURIComponent(path);
          }
          
          items.push({ tipo, path, fileUrl, index });
        });
        
        // Botón anterior
        if (items.length > 1) {
          popupContent += '<button class="carousel-btn carousel-prev" onclick="carouselPrev(\'' + carouselId + '\')" aria-label="Anterior">‹</button>';
        }
        
        // Contenedor de slides
        popupContent += '<div class="carousel-slides">';
        items.forEach(function(item, index) {
          popupContent += '<div class="carousel-slide' + (index === 0 ? ' active' : '') + '">';
          
          if (item.tipo === 'IMAGEN') {
            popupContent += '<div class="carousel-item-image">';
            popupContent += '<img src="' + item.fileUrl + '" alt="' + item.path + '" loading="lazy" ';
            popupContent += 'onclick="window.open(\'' + item.fileUrl + '\', \'_blank\')" ';
            popupContent += 'onerror="this.onerror=null; this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';" />';
            popupContent += '<div class="carousel-error" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px;">';
            popupContent += '<span style="font-size: 1.5rem;">🖼️</span>';
            popupContent += '<span>Imagen no disponible</span>';
            popupContent += '</div>';
            popupContent += '</div>';
          } else if (item.tipo === 'VIDEO') {
            popupContent += '<div class="carousel-item-video">';
            popupContent += '<video src="' + item.fileUrl + '" controls preload="metadata" ';
            popupContent += 'onerror="this.onerror=null; this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';"></video>';
            popupContent += '<div class="carousel-error" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px;">';
            popupContent += '<span style="font-size: 1.5rem;">🎬</span>';
            popupContent += '<span>Video no disponible</span>';
            popupContent += '</div>';
            popupContent += '</div>';
          } else if (item.tipo === 'AUDIO') {
            popupContent += '<div class="carousel-item-audio">';
            popupContent += '<div style="font-size: 2rem; text-align: center; margin-bottom: 10px;">🎵</div>';
            popupContent += '<audio src="' + item.fileUrl + '" controls style="width: 100%;" ';
            popupContent += 'onerror="this.onerror=null; this.parentElement.querySelector(\'.carousel-error\').style.display=\'flex\';"></audio>';
            popupContent += '<div class="carousel-error" style="display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px;">';
            popupContent += '<span style="font-size: 1.5rem;">🎵</span>';
            popupContent += '<span>Audio no disponible</span>';
            popupContent += '</div>';
            popupContent += '</div>';
          }
          
          popupContent += '</div>';
        });
        popupContent += '</div>'; // carousel-slides
        
        // Botón siguiente
        if (items.length > 1) {
          popupContent += '<button class="carousel-btn carousel-next" onclick="carouselNext(\'' + carouselId + '\')" aria-label="Siguiente">›</button>';
        }
        popupContent += '</div>'; // carousel-container
        
        popupContent += '</div>'; // multimedia-carousel
      }

      // Etiquetas
      if (hecho.etiquetas && hecho.etiquetas.length > 0) {
        popupContent += '<div><strong>Etiquetas:</strong><div class="tags">';
        hecho.etiquetas.forEach(etiqueta => {
          popupContent += '<span class="tag">' + etiqueta + '</span>';
        });
        popupContent += '</div></div>';
      }

      popupContent += '</div>';
      return popupContent;
    }

    // Agregar marcadores al cluster group
    hechosConCoordenadas.forEach(hecho => {
      const marker = L.marker([hecho.latitud, hecho.longitud]);
      const popupContent = construirPopupContent(hecho);
      marker.bindPopup(popupContent);
      markersCluster.addLayer(marker);
      markers.push(marker);
    });

    // Agregar el cluster group al mapa
    map.addLayer(markersCluster);

    // Si hay un solo hecho, abrir su popup automáticamente
    if (centrarEnHecho && hechosConCoordenadas.length === 1 && markers.length > 0) {
      markers[0].openPopup();
    }

    // Ajustar el zoom si hay muchos marcadores
    if (hechosConCoordenadas.length > 1 && !centrarEnHecho) {
      const group = new L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.1));
    }

    // Mostrar mensaje si no hay hechos con coordenadas
    if (hechosConCoordenadas.length === 0) {
      document.getElementById('no-hechos-message').style.display = 'block';
      document.getElementById('map').style.display = 'none';
    }

    // Funciones del carrusel (reutilizadas desde hechosencoleccion.html)
    function carouselPrev(carouselId) {
      const carousel = document.getElementById(carouselId);
      if (!carousel) return;
      const slides = carousel.querySelectorAll('.carousel-slide');
      let currentIndex = 0;
      slides.forEach((slide, index) => {
        if (slide.classList.contains('active')) {
          currentIndex = index;
        }
      });
      const prevIndex = (currentIndex - 1 + slides.length) % slides.length;
      slides[currentIndex].classList.remove('active');
      slides[prevIndex].classList.add('active');
    }

    function carouselNext(carouselId) {
      const carousel = document.getElementById(carouselId);
      if (!carousel) return;
      const slides = carousel.querySelectorAll('.carousel-slide');
      let currentIndex = 0;
      slides.forEach((slide, index) => {
        if (slide.classList.contains('active')) {
          currentIndex = index;
        }
      });
      const nextIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.remove('active');
      slides[nextIndex].classList.add('active');
    }

    function carouselGoTo(carouselId, index) {
      const carousel = document.getElementById(carouselId);
      if (!carousel) return;
      const slides = carousel.querySelectorAll('.carousel-slide');
      slides.forEach((slide, i) => {
        if (i === index) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
      });
    }
    /*]]>*/
  </script>
</div>
</html>
