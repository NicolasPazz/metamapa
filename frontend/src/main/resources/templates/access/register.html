<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMapa - Registrarse</title>
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <link rel="stylesheet" th:href="@{/css/landing.css}">
  <script th:src="@{/js/common.js}"></script>
</head>
<body>
  <header class="navbar">
    <a th:href="@{/}" class="logo">
      <img th:src="@{/images/metamapa-header.svg}" alt="MetaMapa" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
      <span class="logo-text" style="display: none;">MetaMapa</span>
    </a>
    <nav class="nav-buttons-center">
      <a th:href="@{/hechos}" class="btn secondary">Hechos</a>
      <a th:href="@{/colecciones}" class="btn secondary">Colecciones</a>
    </nav>
    <nav class="nav-buttons">
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit" class="btn secondary">Cerrar sesión</button>
      </form>
    </nav>
  </header>

  <section class="login-block">
    <div class="login-card">
      <h2>Registrarse</h2>
      
      <div th:if="${error}" style="color: red; margin-bottom: 1rem; padding: 0.75rem; background: #fee; border: 1px solid #fcc; border-radius: 6px;">
        <span th:text="${error}">Error</span>
      </div>
      
      <form id="registerForm" th:action="@{/registro}" method="post">
        <div class="form-group">
          <label for="username">
            Usuario <span class="required-indicator" aria-label="Campo obligatorio">*</span>
          </label>
          <input type="text" 
                 id="username" 
                 name="username" 
                 placeholder="Nombre de usuario" 
                 required 
                 class="form-control"
                 aria-required="true"
                 aria-describedby="username-help">
          <div class="field-error" id="username-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="nombre">
            Nombre <span class="required-indicator" aria-label="Campo obligatorio">*</span>
          </label>
          <input type="text" 
                 id="nombre" 
                 name="nombre" 
                 placeholder="Tu nombre" 
                 required 
                 class="form-control"
                 aria-required="true"
                 aria-describedby="nombre-help">
          <div class="field-error" id="nombre-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="password">
            Contraseña <span class="required-indicator" aria-label="Campo obligatorio">*</span>
          </label>
          <input type="password" 
                 id="password" 
                 name="password" 
                 placeholder="••••••••" 
                 required 
                 class="form-control"
                 aria-required="true"
                 aria-describedby="password-help">
          <div class="field-error" id="password-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido <span class="optional-indicator"></span></label>
          <input type="text" 
                 id="apellido" 
                 name="apellido" 
                 placeholder="Tu apellido" 
                 class="form-control"
                 aria-describedby="apellido-help">
        </div>

        <div class="form-group">
          <label for="fecha">Fecha de nacimiento <span class="optional-indicator"></span></label>
          <input type="date" 
                 id="fecha" 
                 name="fecha"
                 class="form-control"
                 aria-describedby="fecha-help">
        </div>

        <button type="submit" class="btn primary" id="submitBtn">Crear cuenta</button>
      </form>

      <div class="login-options" style="text-align: center; margin-top: 1rem;">
        <a th:href="@{/login}">¿Ya tenes cuenta? Ingresar</a>
      </div>
    </div>
  </section>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const registerForm = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitBtn');
      
      function validateField(fieldId, errorId, helpId) {
        const field = document.getElementById(fieldId);
        const errorDiv = document.getElementById(errorId);
        const helpText = document.getElementById(helpId);
        
        field.addEventListener('blur', function() {
          if (field.hasAttribute('required') && !field.value.trim()) {
            field.classList.add('field-invalid');
            errorDiv.textContent = 'Este campo es obligatorio';
            errorDiv.style.display = 'block';
            helpText.style.display = 'none';
          } else {
            field.classList.remove('field-invalid');
            errorDiv.style.display = 'none';
            helpText.style.display = 'block';
          }
        });
        
        field.addEventListener('input', function() {
          if (field.value.trim()) {
            field.classList.remove('field-invalid');
            field.classList.add('field-valid');
            errorDiv.style.display = 'none';
            helpText.style.display = 'block';
          } else if (field.hasAttribute('required')) {
            field.classList.remove('field-valid');
          }
        });
      }
      
      validateField('username', 'username-error', 'username-help');
      validateField('nombre', 'nombre-error', 'nombre-help');
      validateField('password', 'password-error', 'password-help');
      
      registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username');
        const nombre = document.getElementById('nombre');
        const password = document.getElementById('password');
        
        let hasErrors = false;
        
        if (!username.value.trim()) {
          username.classList.add('field-invalid');
          document.getElementById('username-error').textContent = 'Este campo es obligatorio';
          document.getElementById('username-error').style.display = 'block';
          hasErrors = true;
        }
        
        if (!nombre.value.trim()) {
          nombre.classList.add('field-invalid');
          document.getElementById('nombre-error').textContent = 'Este campo es obligatorio';
          document.getElementById('nombre-error').style.display = 'block';
          hasErrors = true;
        }
        
        if (!password.value.trim()) {
          password.classList.add('field-invalid');
          document.getElementById('password-error').textContent = 'Este campo es obligatorio';
          document.getElementById('password-error').style.display = 'block';
          hasErrors = true;
        }
        
        if (hasErrors) {
          showToast('Por favor, completa todos los campos obligatorios.', 'error');
          // Enfocar el primer campo con error
          if (!username.value.trim()) {
            username.focus();
          } else if (!nombre.value.trim()) {
            nombre.focus();
          } else if (!password.value.trim()) {
            password.focus();
          }
          return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Registrando...';
        
        const formData = new FormData(registerForm);
        
        try {
          const response = await safeFetch('/registro', {
            method: 'POST',
            headers: {
              'X-Requested-With': 'XMLHttpRequest'
            },
            body: formData
          }, true); // skipErrorRedirect = true para manejar errores de validación localmente
          
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Crear cuenta';
          
          if (response.ok) {
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
              const data = await response.json();
              
              if (data.success === "true" || data.success === true) {
                showToast('Registro exitoso. Redirigiendo...', 'success', 1500).then(() => {
                  window.location.href = '/login';
                });
              } else {
                const errorMessage = data.error || 'Error al registrar usuario. Por favor, intente nuevamente.';
                showToast(errorMessage, 'error');
              }
            } else {
              const htmlText = await response.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(htmlText, 'text/html');
              
              const isLoginPage = doc.querySelector('h2') && doc.querySelector('h2').textContent.includes('Ingresar');
              const isRegisterPage = doc.querySelector('h2') && doc.querySelector('h2').textContent.includes('Registrarse');
              
              if (isLoginPage) {
                showToast('Registro exitoso. Redirigiendo...', 'success', 1500).then(() => {
                  window.location.href = '/login';
                });
              } else if (isRegisterPage) {
                let errorMessage = 'Error al registrar usuario. Por favor, intente nuevamente.';
                
                const errorDiv = doc.querySelector('div[style*="color: red"]') || 
                               doc.querySelector('.error');
                
                if (errorDiv) {
                  const errorSpan = errorDiv.querySelector('span');
                  if (errorSpan) {
                    errorMessage = errorSpan.textContent.trim();
                  } else {
                    errorMessage = errorDiv.textContent.trim();
                  }
                }
                
                showToast(errorMessage, 'error');
              } else {
                showToast('Registro exitoso. Redirigiendo...', 'success', 1500).then(() => {
                  window.location.href = '/login';
                });
              }
            }
          } else {
            // Para errores que no son de validación (400), redirigir a página de error
            if (response.status !== 400) {
              redirectToErrorPage(response.status);
            } else {
              const htmlText = await response.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(htmlText, 'text/html');
              
              let errorMessage = 'Error al registrar usuario. Por favor, intente nuevamente.';
              
              const errorDiv = doc.querySelector('div[style*="color: red"]') || 
                             doc.querySelector('.error');
              
              if (errorDiv) {
                const errorSpan = errorDiv.querySelector('span');
                if (errorSpan) {
                  errorMessage = errorSpan.textContent.trim();
                } else {
                  errorMessage = errorDiv.textContent.trim();
                }
              }
              
              showToast(errorMessage, 'error');
            }
          }
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Crear cuenta';
          // Si es un error de red, redirigir a error 500
          redirectToErrorPage(500);
        }
      });
    });
  </script>
  
</body>
</html>
