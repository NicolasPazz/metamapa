<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo} + ' - MetaMapa'"></title>
        <meta name="api-base-url" th:content="${apiBaseUrl}">
        <link th:href="@{/css/landing.css}" rel="stylesheet">
        <script th:src="@{/js/common.js}"></script>
    </head>
    <body>
        <!-- Header -->
        <header class="navbar">
            <a th:href="@{/}" class="logo">MetaMapa</a>
            <nav class="nav-buttons-center">
                <!-- Mostrar botón Hechos solo si showHechosBtn es true o no está definido -->
                <a th:if="${showHechosBtn == null || showHechosBtn}" th:href="@{/hechos}" class="btn secondary">Hechos</a>
                <!-- Mostrar botón Colecciones solo si showColeccionesBtn es true o no está definido -->
                <a th:if="${showColeccionesBtn == null || showColeccionesBtn}" th:href="@{/colecciones}" class="btn secondary">Colecciones</a>
                <!-- Mostrar botón Mis hechos solo si showMisHechosBtn es true y el usuario está autenticado -->
                <a sec:authorize="isAuthenticated()" th:if="${showMisHechosBtn == null || showMisHechosBtn}" th:href="@{/hechos/mis-hechos}" class="btn secondary">Mis hechos</a>
                <!-- Mostrar botón Solicitudes solo si el usuario está autenticado -->
                <a sec:authorize="isAuthenticated()" th:href="@{/solicitudes}" class="btn secondary">
                    <i class="bi bi-file-earmark-text me-1"></i> Mis Solicitudes
                </a>
                <!-- Mostrar botón Reportar nuevo hecho solo si showReportarHechoBtn es true o no está definido -->
                <a th:if="${showReportarHechoBtn == null || showReportarHechoBtn}" th:href="@{/hechos/nuevo}" class="btn btn-primary btn-lg shadow-sm">
                    <i class="bi bi-plus-circle-fill me-2"></i> Reportar nuevo hecho
                </a>
            </nav>
            <nav class="nav-buttons">
                <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn secondary">Ingresar</a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/registro}" class="btn primary">Registrarse</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn secondary">Cerrar sesión</button>
                </form>
            </nav>
        </header>

        <!-- Contenido principal -->
        <div th:replace=":: contenido"></div>
    </body>
</html>
