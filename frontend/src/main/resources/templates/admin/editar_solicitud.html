<!DOCTYPE html>
<html lang="es" th:replace="~{layout/base :: html}">
<head>
    <title>Editar Solicitud</title>
</head>
<body>

<div th:fragment="contenido">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow border-0 rounded-3">
                    <div class="card-header bg-warning bg-opacity-10 py-3">
                        <h4 class="mb-0 fw-bold text-dark">
                            <i class="bi bi-pencil-square me-2"></i>Editar Solicitud
                        </h4>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/solicitudes/{id}/editar(id=${solicitud.id})}" method="post">

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">ID Referencia</label>
                                <input type="text" class="form-control bg-light" th:value="${solicitud.id}" disabled>
                            </div>

                            <div class="mb-3">
                                <label for="titulo" class="form-label fw-bold">Título</label>
                                <input type="text" class="form-control" id="titulo" name="titulo"
                                       th:value="${solicitud.titulo}" required>
                            </div>

                            <div class="mb-3">
                                <label for="nombreCategoria" class="form-label fw-bold">Categoría</label>
                                <input type="text" class="form-control" id="nombreCategoria" name="nombreCategoria"
                                       th:value="${solicitud.nombreCategoria}" required>
                            </div>

                            <div class="mb-4">
                                <label for="descripcion" class="form-label fw-bold">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="5"
                                          th:text="${solicitud.descripcion}"></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin/solicitudes}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Volver
                                </a>
                                <button type="submit" class="btn btn-warning fw-bold text-dark px-4">
                                    <i class="bi bi-save"></i> Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
