<!DOCTYPE html>
<html lang="es" th:replace="~{layout/base :: html}">
<div th:fragment="contenido">
  <link rel="stylesheet" th:href="@{/css/landing.css}">
  
  <div id="toastContainer" class="toast-container"></div>

  <section class="block" style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <div class="container">
      <h2 style="text-align: center; color: var(--primary);">Nuevo Hecho</h2>
      
      <form id="hechoForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="titulo">
            Título <span class="required-indicator" aria-label="Campo obligatorio">*</span>
            <span class="tooltip-container">
              <span class="tooltip-trigger" aria-label="Ayuda sobre el título">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
              </span>
              <span class="tooltip" role="tooltip">Describe brevemente el hecho que quieres reportar</span>
            </span>
          </label>
          <input type="text" 
                 class="form-control" 
                 id="titulo" 
                 name="titulo" 
                 placeholder="Ej: Inundación en Av. Corrientes" 
                 required
                 aria-required="true"
                 aria-describedby="titulo-help">
        </div>

        <div class="form-group">
          <label>
            Ubicación <span class="required-indicator" aria-label="Campo obligatorio">*</span>
            <span class="tooltip-container">
              <span class="tooltip-trigger" aria-label="Ayuda sobre ubicación">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle;">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
              </span>
              <span class="tooltip" role="tooltip">Ingresa las coordenadas geográficas o usa tu ubicación actual</span>
            </span>
          </label>
          <div style="display: flex; gap: 1rem; align-items: stretch;">
            <div style="flex: 1; display: flex; gap: 1rem;">
              <div style="flex: 1;">
                <input type="number" 
                       step="any" 
                       class="form-control" 
                       id="latitud" 
                       name="latitud" 
                       placeholder="Latitud" 
                       required
                       min="-90"
                       max="90"
                       aria-required="true"
                       aria-label="Latitud (entre -90 y 90)">
              </div>
              <div style="flex: 1;">
                <input type="number" 
                       step="any" 
                       class="form-control" 
                       id="longitud" 
                       name="longitud" 
                       placeholder="Longitud" 
                       required
                       min="-180"
                       max="180"
                       aria-required="true"
                       aria-label="Longitud (entre -180 y 180)">
              </div>
            </div>
            <button type="button" 
                    onclick="obtenerUbicacion()" 
                    class="btn secondary" 
                    style="white-space: nowrap; margin-top: 0; min-width: 48px; min-height: 48px;"
                    aria-label="Usar mi ubicación actual">
              Usar mi ubicación
            </button>
          </div>
          <div id="location-status" class="form-text" role="status" aria-live="polite">
            Ingresa coordenadas o usa el botón.
          </div>
        </div>

        <div class="form-group">
          <label for="categoria">
            Categoría <span class="required-indicator">*</span>
          </label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" 
                   list="categorias-list" 
                   class="form-control" 
                   id="categoria" 
                   name="categoria" 
                   placeholder="Selecciona o escribe una nueva categoría" 
                   required
                   autocomplete="off"
                   style="flex: 1;">
            <datalist id="categorias-list">
              <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
            </datalist>
          </div>
        </div>

        <div class="form-group">
          <label for="fechaAcontecimiento">
            Fecha y Hora <span class="required-indicator">*</span>
          </label>
          <input type="datetime-local" 
                 class="form-control" 
                 id="fechaAcontecimiento" 
                 name="fechaAcontecimiento" 
                 required
                 min="1900-01-01T00:00"
                 max="9999-12-31T23:59">
          <div id="fecha-error" class="error-message" style="display: none;"></div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="fotos" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Evidencia multimedia
          </label>
          <input type="file" 
                 class="form-control" 
                 id="fotos" 
                 name="contenidoMultimedia" 
                 multiple 
                 accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,audio/mpeg,audio/wav,audio/ogg" 
                 onchange="validarCantidadArchivos(this, 5); previewMedia();"
                 style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
          <div id="preview-container" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem;"></div>
          <small style="color: #666; font-size: 0.85rem;">
            Formatos permitidos: Imágenes (jpg, jpeg, png, gif, webp) | Videos (mp4, webm) | Audio (mp3, wav, ogg). Máximo 5 archivos.
          </small>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="descripcion" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Descripción <span style="color: #dc3545;">*</span>
          </label>
          <textarea class="form-control" 
                    id="descripcion" 
                    name="descripcion" 
                    rows="4" 
                    placeholder="Describe qué sucedió..."
                    required
                    style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" 
                  class="btn primary" 
                  id="submitBtn"
                  style="flex: 1; padding: 0.75rem 1.5rem;">
            Solicitar publicación
          </button>
          <a th:href="@{/}" class="btn secondary" style="padding: 0.75rem 1.5rem;">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </section>

  <script th:inline="javascript">
    /*<![CDATA[*/
    
    // Función para obtener ubicación del navegador (usa función común)
    function obtenerUbicacion() {
      const status = document.getElementById('location-status');
      
      status.textContent = "Localizando...";
      status.style.color = '#666';
      
      obtenerUbicacionUsuario(
        (coords) => {
          // Asegurar que los valores sean números y se asignen correctamente
          const lat = Number(coords.latitud);
          const lng = Number(coords.longitud);
          
          if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            const latInput = document.getElementById('latitud');
            const lngInput = document.getElementById('longitud');
            
            // Asignar valores directamente como números
            latInput.value = lat;
            lngInput.value = lng;
            
            // Disparar evento change para asegurar que el valor se registre
            latInput.dispatchEvent(new Event('change', { bubbles: true }));
            lngInput.dispatchEvent(new Event('change', { bubbles: true }));
            
            status.textContent = "¡Ubicación encontrada!";
            status.style.color = '#28a745';
          } else {
            status.textContent = "Error: No se pudieron obtener coordenadas válidas.";
            status.style.color = '#dc3545';
          }
        },
        (error) => {
          status.textContent = error;
          status.style.color = '#dc3545';
        }
      );
    }

    function validarCantidadArchivos(input, maxArchivos) {
      if (input.files.length > maxArchivos) {
        showToast(`Solo se pueden seleccionar hasta ${maxArchivos} archivos. Se mantendrán solo los primeros ${maxArchivos}.`, 'error');
        // Crear un nuevo DataTransfer para limitar los archivos
        const dataTransfer = new DataTransfer();
        for (let i = 0; i < maxArchivos; i++) {
          dataTransfer.items.add(input.files[i]);
        }
        input.files = dataTransfer.files;
      }
    }

    // Función para previsualizar multimedia (imágenes, videos, audios)
    function previewMedia() {
      const preview = document.getElementById('preview-container');
      const fileInput = document.getElementById('fotos');
      preview.innerHTML = "";

      if (fileInput.files) {
        Array.from(fileInput.files).forEach(file => {
          const reader = new FileReader();
          
          reader.addEventListener("load", function() {
            const fileType = file.type;
            let mediaElement;
            
            if (fileType.startsWith('image/')) {
              // Es una imagen
              mediaElement = document.createElement('img');
              mediaElement.src = this.result;
              mediaElement.style.width = '80px';
              mediaElement.style.height = '80px';
              mediaElement.style.objectFit = 'cover';
            } else if (fileType.startsWith('video/')) {
              // Es un video
              mediaElement = document.createElement('video');
              mediaElement.src = this.result;
              mediaElement.style.width = '80px';
              mediaElement.style.height = '80px';
              mediaElement.style.objectFit = 'cover';
              mediaElement.controls = false;
              mediaElement.muted = true;
            } else if (fileType.startsWith('audio/')) {
              // Es un audio
              mediaElement = document.createElement('div');
              mediaElement.style.width = '80px';
              mediaElement.style.height = '80px';
              mediaElement.style.display = 'flex';
              mediaElement.style.alignItems = 'center';
              mediaElement.style.justifyContent = 'center';
              mediaElement.style.background = '#f0f0f0';
              mediaElement.style.borderRadius = '8px';
              mediaElement.style.border = '2px solid #ddd';
              mediaElement.innerHTML = '🎵';
              mediaElement.title = file.name;
            } else {
              // Tipo no soportado
              return;
            }
            
            if (mediaElement.tagName !== 'DIV') {
              mediaElement.style.borderRadius = '8px';
              mediaElement.style.border = '2px solid #ddd';
              mediaElement.title = file.name;
            }
            
            preview.appendChild(mediaElement);
          });
          
          reader.readAsDataURL(file);
        });
      }
    }

    // showToast está definido en common.js

    // Validar fecha y hora
    function validarFechaHora() {
      const fechaInput = document.getElementById('fechaAcontecimiento');
      const errorDiv = document.getElementById('fecha-error');
      const fechaValue = fechaInput.value;

      if (!fechaValue) {
        errorDiv.style.display = 'none';
        return true;
      }

      const fecha = new Date(fechaValue);
      const ahora = new Date();

      if (isNaN(fecha.getTime())) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'La fecha y hora ingresadas no son válidas.';
        errorDiv.style.color = '#dc3545';
        return false;
      }

      if (fecha > ahora) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'La fecha y hora no pueden ser futuras.';
        errorDiv.style.color = '#dc3545';
        return false;
      }

      errorDiv.style.display = 'none';
      return true;
    }

    // Función para obtener fecha y hora local en formato datetime-local
    function obtenerFechaHoraLocal() {
      const ahora = new Date();
      const year = ahora.getFullYear();
      const month = String(ahora.getMonth() + 1).padStart(2, '0');
      const day = String(ahora.getDate()).padStart(2, '0');
      const hours = String(ahora.getHours()).padStart(2, '0');
      const minutes = String(ahora.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    // Event listener para validar fecha en tiempo real
    document.addEventListener('DOMContentLoaded', function() {
      const fechaInput = document.getElementById('fechaAcontecimiento');
      if (fechaInput) {
        // Establecer fecha máxima como ahora (en zona horaria local)
        const fechaMax = obtenerFechaHoraLocal();
        fechaInput.setAttribute('max', fechaMax);
        
        // Establecer fecha y hora actual como valor por defecto (en zona horaria local)
        if (!fechaInput.value) {
          fechaInput.value = fechaMax;
        }
        
        fechaInput.addEventListener('change', validarFechaHora);
        fechaInput.addEventListener('blur', validarFechaHora);
      }

      // Manejar envío del formulario
      const form = document.getElementById('hechoForm');
      const submitBtn = document.getElementById('submitBtn');

      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();

          // Validar fecha antes de enviar
          if (!validarFechaHora()) {
            showToast('Por favor, corrige la fecha y hora antes de continuar.', 'error');
            return;
          }

          // Validar cantidad de archivos multimedia
          const fileInput = document.getElementById('fotos');
          if (fileInput && fileInput.files.length > 5) {
            showToast('Solo se pueden cargar hasta 5 archivos. Por favor, selecciona menos archivos.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');
            return;
          }

          // Deshabilitar botón durante el envío y mostrar spinner
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner"></span> Enviando...';
          submitBtn.setAttribute('aria-busy', 'true');

          // Obtener valores directamente de los inputs
          const latInput = document.getElementById('latitud');
          const lngInput = document.getElementById('longitud');
          const latitudValue = latInput ? latInput.value : null;
          const longitudValue = lngInput ? lngInput.value : null;
          
          // Crear FormData
          const formData = new FormData(form);
          
          // Validar y convertir a número antes de enviar
          if (!latitudValue || latitudValue.trim() === '') {
            showToast('La latitud es obligatoria.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');
            return;
          }
          
          if (!longitudValue || longitudValue.trim() === '') {
            showToast('La longitud es obligatoria.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');
            return;
          }
          
          const lat = Number(latitudValue);
          const lng = Number(longitudValue);
          
          if (isNaN(lat) || lat < -90 || lat > 90) {
            showToast('La latitud debe estar entre -90 y 90.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');
            return;
          }
          
          if (isNaN(lng) || lng < -180 || lng > 180) {
            showToast('La longitud debe estar entre -180 y 180.', 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');
            return;
          }
          
          formData.set('latitud', lat.toString());
          formData.set('longitud', lng.toString());
          
          // Convertir fecha de zona local del navegador a UTC antes de enviar
          const fechaAcontecimientoInput = document.getElementById('fechaAcontecimiento');
          if (fechaAcontecimientoInput && fechaAcontecimientoInput.value) {
            const fechaLocal = fechaAcontecimientoInput.value; // Formato: yyyy-MM-ddTHH:mm (zona local)
            const fechaUTC = convertLocalToUTC(fechaLocal); // Convertir a UTC
            formData.set('fechaAcontecimiento', fechaUTC);
          }

          try {
            const response = await safeFetch('/hechos/crear', {
              method: 'POST',
              headers: {
                'X-Requested-With': 'XMLHttpRequest'
              },
              body: formData
            }, true); // skipErrorRedirect = true para manejar errores de validación localmente

            // Resetear botón
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');

            if (response.ok) {
              showToast('Solicitud de publicación de hecho creado exitosamente. Será revisado por los administradores.', 'success').then(() => {
                window.location.href = '/hechos/mis-hechos';
              });
            } else {
              const errorText = await response.text();
              // Si es un error de tamaño de archivo (413), mostrar mensaje específico
              if (response.status === 413 || response.status === 400) {
                const mensaje = errorText || 'El archivo es demasiado grande. El tamaño máximo permitido es de 50 MB. Por favor, reduzca el tamaño del archivo e intente nuevamente.';
                showToast(mensaje, 'error');
              } else {
                // Para otros errores, redirigir a la página de error correspondiente
                redirectToErrorPage(response.status);
              }
            }
          } catch (error) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Solicitar publicación';
            submitBtn.removeAttribute('aria-busy');
            // Si es un error de red, redirigir a error 500
            redirectToErrorPage(500);
          }
        });
      }
    });
    /*]]>*/
  </script>
</div>
</html>
