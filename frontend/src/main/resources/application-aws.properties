# Configuracion para despliegue en AWS - Frontend
spring.application.name=frontend
server.port=${PORT:8080}

# Custom properties
# Paginacion
app.pagination.page-size=18

# URLs de servicios backend
# Ejemplo con ALB/ELB o nombres de servicio en ECS/EKS
app.api.agregador.base-url=${AGREGADOR_URL:http://agregador-service:8084}/api
app.api.dinamica.base-url=${DINAMICA_URL:http://dinamica-service:8081}/api
app.api.estatica.base-url=${ESTATICA_URL:http://estatica-service:8082}/api
app.api.users.base-url=${USERS_URL:http://users-service:8087}/api

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.http.codecs.max-in-memory-size=10MB

# Configuracion de logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.frontend=INFO
logging.level.org.springframework.web=WARN
