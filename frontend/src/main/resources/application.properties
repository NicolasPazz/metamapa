spring.application.name=frontend
server.port=${PORT:8080}

# Custom properties
# Paginacion
app.pagination.page-size=${PAGINATION_PAGE_SIZE}

# URLs de servicios backend
app.api.agregador.base-url=${AGREGADOR_URL}/api
app.api.dinamica.base-url=${DINAMICA_URL}/api
app.api.estatica.base-url=${ESTATICA_URL}/api
app.api.users.base-url=${USERS_SERVICE_URL}/api
app.api.estadistica.base-url=${ESTADISTICA_URL:http://localhost:8085}/api/estadisticas

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.http.codecs.max-in-memory-size=10MB

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.frontend=INFO
logging.level.org.springframework.web=INFO

# Configuracion de Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
