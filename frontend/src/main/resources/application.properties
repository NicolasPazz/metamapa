spring.application.name=frontend
server.port=${PORT:8080}

# Custom properties
# Paginacion
app.pagination.page-size=${PAGINATION_PAGE_SIZE:18}

# URLs de servicios backend
app.api.agregador.base-url=${AGREGADOR_URL:http://localhost:8084}/api
app.api.dinamica.base-url=${DINAMICA_URL:http://localhost:8081}/api
app.api.estatica.base-url=${ESTATICA_URL:http://localhost:8082}/api
app.api.users.base-url=${USERS_SERVICE_URL:http://localhost:8087}/api

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.http.codecs.max-in-memory-size=10MB

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.frontend=INFO
logging.level.org.springframework.web=INFO
