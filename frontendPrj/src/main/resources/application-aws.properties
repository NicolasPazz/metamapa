# Configuracion para despliegue en AWS
spring.application.name=frontendPrj
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.port=${PORT:8080}
spring.http.codecs.max-in-memory-size=10MB

# Paginacion
app.pagination.page-size=18

# URLs de servicios backend
# Ejemplo con ALB/ELB:
app.api.agregador.base-url=${AGREGADOR_URL:http://agregador-service:8084}/api
app.api.dinamica.base-url=${DINAMICA_URL:http://dinamica-service:8081}/api
app.api.estatica.base-url=${ESTATICA_URL:http://estatica-service:8082}/api

# Configuracion de logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.frontend=INFO
logging.level.org.springframework.web=WARN

