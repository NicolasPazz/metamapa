<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMapa - Registrarse</title>
  <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <a th:href="@{/}" class="logo">MetaMapa</a>
    <nav class="nav-buttons-center">
      <a th:href="@{/hechos}" class="btn secondary">Hechos</a>
      <a th:href="@{/colecciones}" class="btn secondary">Colecciones</a>
    </nav>
    <nav class="nav-buttons">
      <a th:href="@{/login}" class="btn secondary">Ingresar</a>
    </nav>
  </header>

  <!-- Register form -->
  <section class="login-block">
    <div class="login-card">
      <h2>Registrarse</h2>
      <form>
        <!-- Mandatory fields -->
        <label for="email">Correo *</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>

        <label for="nombre">Nombre *</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label for="password">Contraseña *</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <!-- Optional fields -->
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Tu apellido">

        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" id="fecha">

        <button type="submit" class="btn primary">Crear cuenta</button>
      </form>

      <div class="login-options">
        <a th:href="@{/login}">¿Ya tienes cuenta? Ingresar</a>
      </div>
    </div>
  </section>
</body>
</html>
