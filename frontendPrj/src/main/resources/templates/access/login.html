<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMapa - Ingresar</title>
  <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <div class="logo">MetaMapa</div>
  </header>

  <!-- Login form -->
  <section class="login-block">
    <div class="login-card">
      <h2>Ingresar</h2>
      <form>
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <button type="submit" class="btn primary">Ingresar</button>
      </form>

      <div class="login-options">
        <a href="#">Registrarse</a>
        <a th:href="@{/colecciones}">Ingresar como anónimo</a>
      </div>
    </div>
  </section>
</body>
</html>
