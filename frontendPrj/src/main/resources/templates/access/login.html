<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMapa - Ingresar</title>
  <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>
<body>
  <!-- Header -->
  <header class="navbar">
    <a th:href="@{/}" class="logo">MetaMapa</a>
    <nav class="nav-buttons-center">
      <a th:href="@{/hechos}" class="btn secondary">Hechos</a>
      <a th:href="@{/colecciones}" class="btn secondary">Colecciones</a>
    </nav>
    <nav class="nav-buttons">
      <a th:href="@{/registro}" class="btn primary">Registrarse</a>
    </nav>
  </header>

      <!-- Login form -->
      <section class="login-block">
        <div class="login-card">
          <h2>Ingresar</h2>
          <form th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" placeholder="usuario" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <!-- Mostrar errores de autenticación si existen -->
            <div th:if="${param.error}" style="color: red; margin-top: 1rem;">
              Usuario o contraseña incorrectos
            </div>
            <div th:if="${param.logout}" style="color: green; margin-top: 1rem;">
              Sesión cerrada correctamente
            </div>

            <button type="submit" class="btn primary">Ingresar</button>
          </form>

      <div class="login-options">
        <a href="#">Registrarse</a>
        <a th:href="@{/colecciones}">Ingresar como anónimo</a>
      </div>
    </div>
  </section>
</body>
</html>
