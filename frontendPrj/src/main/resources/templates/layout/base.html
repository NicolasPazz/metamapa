<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo} + ' - MetaMapa'"></title>
        <link th:href="@{/css/landing.css}" rel="stylesheet">
    </head>
    <body>
        <!-- Header -->
        <header class="navbar">
            <a th:href="@{/}" class="logo">MetaMapa</a>
            <nav class="nav-buttons-center">
                <!-- Mostrar botón Hechos solo si showHechosBtn es true o no está definido -->
                <a th:if="${showHechosBtn == null || showHechosBtn}" th:href="@{/hechos}" class="btn secondary">Hechos</a>
                <!-- Mostrar botón Colecciones solo si showColeccionesBtn es true o no está definido -->
                <a th:if="${showColeccionesBtn == null || showColeccionesBtn}" th:href="@{/colecciones}" class="btn secondary">Colecciones</a>
                <a th:href="@{/hechos/nuevo}" class="btn btn-primary btn-lg shadow-sm">
                    <i class="bi bi-plus-circle-fill me-2"></i> Reportar Nuevo Hecho
                </a>
            </nav>
            <nav class="nav-buttons">
                <a th:href="@{/login}" class="btn secondary">Ingresar</a>
                <a th:href="@{/registro}" class="btn primary">Registrarse</a>
            </nav>
        </header>

        <!-- Contenido principal -->
        <div th:replace=":: contenido"></div>
    </body>
</html>
