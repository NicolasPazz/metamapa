<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMapa - Hechos</title>
  <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>


<html lang="es" th:replace="~{layout/base :: html}">
<div th:fragment="contenido">
  <section class="hechos-block">
    <!--<h2>Colección: Derechos Humanos</h2> -->

    <!-- Switch de modo solo visible en colecciones - fuera de filtros -->
    <div class="modo-switch-fixed" th:if="${esColeccion != null and esColeccion}">
      <form method="get" th:action="'/colecciones/' + ${handleColeccion} + '/hechos'" style="margin: 0;">
        <!-- Mantener los filtros actuales como hidden inputs -->
        <input type="hidden" name="fecha_reporte_desde" th:value="${param.fecha_reporte_desde}">
        <input type="hidden" name="fecha_reporte_hasta" th:value="${param.fecha_reporte_hasta}">
        <input type="hidden" name="ubicacion" th:value="${param.ubicacion}">
        <input type="hidden" name="categoria" th:value="${param.categoria}">
        <input type="hidden" name="page" th:value="${param.page}">

        <label class="modo-switch-label">
          <span class="modo-text">IRRESTRICTA</span>
          <label class="switch">
            <input type="checkbox"
                   id="modoSwitch"
                   name="modoCheckbox"
                   th:checked="${param.modo != null and param.modo[0] == 'CURADA'}"
                   onchange="document.getElementById('modoHidden').value = this.checked ? 'CURADA' : 'IRRESTRICTA'; this.form.submit();">
            <span class="slider"></span>
          </label>
          <span class="modo-text">CURADA</span>
        </label>
        <input type="hidden"
               id="modoHidden"
               name="modo"
               th:value="${param.modo != null and param.modo[0] == 'CURADA' ? 'CURADA' : 'IRRESTRICTA'}">
      </form>
    </div>

    <form method="get" class="filters" th:action="${esColeccion != null and esColeccion ? '/colecciones/' + handleColeccion + '/hechos' : '/hechos'}">
      <input type="hidden" th:if="${esColeccion != null and esColeccion}" name="modo" th:value="${param.modo}">

      <div class="filtro-fecha">
        <label for="fechaDesde">Desde:</label>
        <input type="date" id="fechaDesde" name="fecha_reporte_desde" th:value="${param.fecha_reporte_desde}">
      </div>

      <div class="filtro-fecha">
        <label for="fechaHasta">Hasta:</label>
        <input type="date" id="fechaHasta" name="fecha_reporte_hasta" th:value="${param.fecha_reporte_hasta}">
      </div>

      <label for="ubicacion" style="display: none;">Provincia</label>
      <select name="ubicacion" id="ubicacion">
        <option value="">Provincia</option>
        <option th:each="prov : ${provincias}"
                th:value="${prov}"
                th:text="${prov}"
                th:selected="${param.ubicacion != null and param.ubicacion[0] == prov}">
        </option>
      </select>

      <label for="categoria" style="display: none;">Categoría</label>
      <select name="categoria" id="categoria">
        <option value="">Categoría</option>
        <option th:each="cat : ${categorias}"
                th:value="${cat}"
                th:text="${cat}"
                th:selected="${param.categoria != null and param.categoria[0] == cat}">
        </option>
      </select>

      <label for="fuente" style="display: none;">Fuente</label>
      <select name="fuente" id="fuente">
        <option value="">Fuente</option>
        <option th:each="fuente : ${fuentes}"
                th:value="${fuente}"
                th:text="${fuente}"
                th:selected="${param.fuente != null and param.fuente[0] == fuente}">
        </option>
      </select>

      <button type="submit" class="btn primary">Aplicar Filtros</button>

      <a th:href="${esColeccion != null and esColeccion ? '/colecciones/' + handleColeccion + '/hechos' : '/hechos'}" class="btn primary">Limpiar</a>

    </form>

    <div style="text-align: right; margin: 20px 0;">
      <a th:href="${esColeccion != null and esColeccion ? '/colecciones/' + handleColeccion + '/mapa' : '/hechos/mapa'}" 
         class="btn primary">
        Ver en mapa
      </a>
    </div>

    <div class="hechos-grid">
      <div th:each="hecho, iterStat : ${hechos}" class="hecho-card"
           th:data-hecho-id="${hecho.id}"
           th:attr="data-fuente-id=${hecho['fuente_id']}, data-id-origen=${hecho['id_origen']}"
           th:data-hecho-index="${iterStat.index}"
           onclick="openHechoDetailPanel(this)"
           style="cursor: pointer;">
        <h3 th:text="${hecho.titulo}"></h3>
        <p th:text="${hecho.descripcion}"></p>
        <span class="ver-detalles-link">Ver detalles</span>
      </div>
    </div>

    <div class="pagination">
      <a th:if="${currentPage > 0}"
         th:href="@{${esColeccion != null and esColeccion ? '/colecciones/' + handleColeccion + '/hechos' : '/hechos'}(
                    page=${currentPage - 1},
                    fecha_reporte_desde=${param.fecha_reporte_desde},
                    fecha_reporte_hasta=${param.fecha_reporte_hasta},
                    ubicacion=${param.ubicacion},
                    categoria=${param.categoria},
                    fuente=${param.fuente},
                    modo=${param.modo})}"
         class="btn primary">
        ← Anterior
      </a>

      <span class="page-indicator">Página <strong th:text="${currentPage + 1}">1</strong></span>
      <a th:if="${hasNextPage}"
         th:href="@{${esColeccion != null and esColeccion ? '/colecciones/' + handleColeccion + '/hechos' : '/hechos'}(
                    page=${currentPage + 1},
                    fecha_reporte_desde=${param.fecha_reporte_desde},
                    fecha_reporte_hasta=${param.fecha_reporte_hasta},
                    ubicacion=${param.ubicacion},
                    categoria=${param.categoria},
                    fuente=${param.fuente},
                    modo=${param.modo})}"
         class="btn primary">
        Siguiente →
      </a>
    </div>
  </section>

  <div id="hechoDetailPanel" class="side-panel">
    <div class="panel-header">
      <h3>Detalles del Hecho</h3>
      <button class="close-btn" onclick="closeHechoDetailPanel()">&times;</button>
    </div>
    <div class="panel-content" id="hechoDetailContent">
    </div>
  </div>

  <div id="overlay" class="overlay" onclick="closeHechoDetailPanel()"></div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Modal de solicitud de eliminación -->
  <div id="solicitudEliminacionModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Solicitar Eliminación de Hecho</h3>
        <button class="close-btn" onclick="closeSolicitudEliminacionModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="solicitudEliminacionForm">
          <input type="hidden" id="solicitud_hecho_id" name="hecho_id">
          <input type="hidden" id="solicitud_fuente_id" name="fuente_id">
          <input type="hidden" id="solicitud_id_origen" name="id_origen">
          
          <div class="form-group">
            <label for="texto_fundamentos">
              Justificación <span style="color: #dc3545;">*</span>
              <small>(Mínimo 500 caracteres)</small>
            </label>
            <textarea 
              id="texto_fundamentos" 
              name="texto_fundamentos" 
              rows="8" 
              required
              minlength="500"
              placeholder="Por favor, proporcione una justificación detallada de al menos 500 caracteres explicando por qué solicita la eliminación de este hecho..."
              style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
            <div class="char-counter">
              <span id="char_count">0</span> / 500 caracteres mínimos
            </div>
            <div id="texto_error" class="error-message" style="display: none;"></div>
          </div>

          <div class="form-group" style="margin-top: 1rem;">
            <p style="font-size: 0.9rem; color: #666; font-style: italic;">
              <strong>Nota:</strong> Esta solicitud será revisada por los administradores. 
              Si la justificación contiene spam, será rechazada automáticamente.
            </p>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn secondary" onclick="closeSolicitudEliminacionModal()">
              Cancelar
            </button>
            <button type="submit" class="btn primary" id="submit_solicitud" style="background: #dc3545; color: white; border: none;">
              Enviar Solicitud
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const hechosData = /*[[${hechos}]]*/ [];

    function openHechoDetailPanel(element) {
      const hechoId = element.dataset.hechoId;
      const fuenteId = element.dataset.fuenteId;
      const idOrigen = element.dataset.idOrigen;
      const hechoIndex = element.dataset.hechoIndex;
      let hecho = null;
      if (hechoId && hechoId !== 'null') {
        const hechoIdNum = Number(hechoId);
        hecho = hechosData.find(h => h.id != null && Number(h.id) === hechoIdNum);
      }
      if (!hecho && fuenteId && fuenteId !== 'null' && idOrigen && idOrigen !== 'null') {
        const fuenteIdNum = Number(fuenteId);
        const idOrigenNum = Number(idOrigen);
        hecho = hechosData.find(h => 
          h.fuente_id != null && Number(h.fuente_id) === fuenteIdNum && 
          h.id_origen != null && Number(h.id_origen) === idOrigenNum
        );
      }
      if (!hecho && hechoIndex !== undefined) {
        hecho = hechosData[parseInt(hechoIndex)];
      }
      
      if (!hecho) return;

      const panel = document.getElementById('hechoDetailPanel');
      const overlay = document.getElementById('overlay');
      const content = document.getElementById('hechoDetailContent');

      let html = '<h2>' + hecho.titulo + '</h2>';

        if (hecho.categoria) {
            html += '<p><strong>Categoría:</strong> ' + hecho.categoria + '</p>';
        }

        if (hecho.descripcion) {
            html += '<p><strong>Descripción:</strong> ' + hecho.descripcion + '</p>';
        }

        if (hecho.fecha_acontecimiento) {
            const fecha = new Date(hecho.fecha_acontecimiento);
            html += '<p><strong>Fecha de acontecimiento:</strong> ' +
                fecha.toLocaleString('es-AR') + '</p>';
        }

        if (hecho.fecha_carga) {
            const fechaCarga = new Date(hecho.fecha_carga);
            html += '<p><strong>Fecha de carga:</strong> ' +
                fechaCarga.toLocaleString('es-AR') + '</p>';
        }

        if (hecho.provincia) {
            html += '<p><strong>Provincia:</strong> ' + hecho.provincia + '</p>';
        }

        if (hecho.latitud != null && hecho.longitud != null) {
            html += '<p><strong>Ubicación:</strong> ' +
                hecho.latitud + ', ' + hecho.longitud + '</p>';
        }

        if (hecho.nombre_fuente) {
            let nombreFuente = hecho.nombre_fuente;
            if (nombreFuente.startsWith('Fuente ')) {
                nombreFuente = nombreFuente.substring(7);
            }
            html += '<p><strong>Fuente:</strong> ' + nombreFuente + '</p>';
        } else if (hecho.origen) {
            html += '<p><strong>Fuente:</strong> ' + hecho.origen + '</p>';
        }

        if (hecho.multimedia && hecho.multimedia.length > 0) {
            html += '<p><strong>Multimedia:</strong> ' +
                hecho.multimedia.length + ' archivo(s)</p>';
        }

        if (hecho.etiquetas && hecho.etiquetas.length > 0) {
            html += '<div><strong>Etiquetas:</strong><div class="tags">';
            hecho.etiquetas.forEach(etiqueta => {
                html += '<span class="tag">' + etiqueta + '</span>';
            });
            html += '</div></div>';
        }

        if (hecho.latitud != null && hecho.longitud != null && 
            !isNaN(hecho.latitud) && !isNaN(hecho.longitud) &&
            hecho.latitud >= -90 && hecho.latitud <= 90 &&
            hecho.longitud >= -180 && hecho.longitud <= 180) {
            let mapaUrl = null;
            if (hecho.id != null) {
                mapaUrl = '/hechos/mapa?hechoId=' + hecho.id;
            } else if (hecho.fuente_id != null && hecho.id_origen != null) {
                mapaUrl = '/hechos/mapa?fuenteId=' + hecho.fuente_id + '&idOrigen=' + hecho.id_origen;
            }
            
            if (mapaUrl != null) {
                html += '<div style="margin-top: 20px; text-align: center;">';
                html += '<a href="' + mapaUrl + '" class="btn primary">';
                html += 'Ver en mapa';
                html += '</a>';
                html += '</div>';
            }
        }

        // Botón para solicitar eliminación
        html += '<div style="margin-top: 20px; text-align: center;">';
        html += '<button onclick="openSolicitudEliminacionModal(' + 
                (hecho.id ? hecho.id : 'null') + ', ' +
                (hecho.fuente_id ? hecho.fuente_id : 'null') + ', ' +
                (hecho.id_origen ? hecho.id_origen : 'null') + 
                ')" class="btn secondary" style="background: #dc3545; color: white; border: none;">';
        html += 'Solicitar eliminación';
        html += '</button>';
        html += '</div>';

      content.innerHTML = html;

      panel.classList.add('active');
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';

      const urlHash = hecho.id != null ? '#hecho' + hecho.id : 
                     (hecho.fuente_id != null && hecho.id_origen != null ? 
                      '#hecho-' + hecho.fuente_id + '-' + hecho.id_origen : '');
      if (urlHash) {
        history.pushState(null, '', urlHash);
      }
    }

    function closeHechoDetailPanel() {
      const panel = document.getElementById('hechoDetailPanel');
      const overlay = document.getElementById('overlay');

      panel.classList.remove('active');
      overlay.classList.remove('active');
      document.body.style.overflow = '';

      const baseUrl = window.location.pathname + window.location.search;
      history.pushState(null, '', baseUrl);
    }

    window.addEventListener('popstate', function() {
      closeHechoDetailPanel();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeHechoDetailPanel();
      }
    });

    window.addEventListener('load', function() {
      const hash = window.location.hash;
      if (hash.startsWith('#hecho')) {
        const hechoId = hash.replace('#hecho', '');
        openHechoDetailPanel(hechoId);
      }
    });

    // Funciones para el modal de solicitud de eliminación
    function openSolicitudEliminacionModal(hechoId, fuenteId, idOrigen) {
      const modal = document.getElementById('solicitudEliminacionModal');
      const form = document.getElementById('solicitudEliminacionForm');
      const textoFundamentos = document.getElementById('texto_fundamentos');
      const charCount = document.getElementById('char_count');
      const errorDiv = document.getElementById('texto_error');
      const submitBtn = document.getElementById('submit_solicitud');
      
      // Resetear completamente el formulario y estado
      form.reset();
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';
      
      // Resetear botón a estado inicial
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar Solicitud';
      
      // Establecer valores ocultos
      document.getElementById('solicitud_hecho_id').value = hechoId !== 'null' ? hechoId : '';
      document.getElementById('solicitud_fuente_id').value = fuenteId !== 'null' ? fuenteId : '';
      document.getElementById('solicitud_id_origen').value = idOrigen !== 'null' ? idOrigen : '';
      
      // Actualizar contador de caracteres
      charCount.textContent = '0';
      charCount.style.color = '#dc3545';
      
      // Mostrar modal
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      
      // Focus en textarea
      setTimeout(() => textoFundamentos.focus(), 100);
    }

    function closeSolicitudEliminacionModal() {
      const modal = document.getElementById('solicitudEliminacionModal');
      const form = document.getElementById('solicitudEliminacionForm');
      const submitBtn = document.getElementById('submit_solicitud');
      const errorDiv = document.getElementById('texto_error');
      
      // Resetear estado antes de cerrar
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar Solicitud';
      errorDiv.style.display = 'none';
      errorDiv.textContent = '';
      
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    // Contador de caracteres
    document.addEventListener('DOMContentLoaded', function() {
      const textoFundamentos = document.getElementById('texto_fundamentos');
      const charCount = document.getElementById('char_count');
      
      if (textoFundamentos && charCount) {
        textoFundamentos.addEventListener('input', function() {
          const length = this.value.trim().length;
          charCount.textContent = length;
          
          // Cambiar color según si cumple el mínimo
          if (length < 500) {
            charCount.style.color = '#dc3545';
          } else {
            charCount.style.color = '#28a745';
          }
        });
      }

      // Manejar envío del formulario
      const form = document.getElementById('solicitudEliminacionForm');
      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const submitBtn = document.getElementById('submit_solicitud');
          const errorDiv = document.getElementById('texto_error');
          const textoFundamentos = document.getElementById('texto_fundamentos');
          const texto = textoFundamentos.value.trim();
          
          // Validar longitud mínima
          if (texto.length < 500) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'La justificación debe tener al menos 500 caracteres. Actualmente tiene ' + texto.length + ' caracteres.';
            return;
          }
          
          // Deshabilitar botón durante el envío
          submitBtn.disabled = true;
          submitBtn.textContent = 'Enviando...';
          errorDiv.style.display = 'none';
          
          // Preparar datos
          const hechoId = document.getElementById('solicitud_hecho_id').value;
          const fuenteId = document.getElementById('solicitud_fuente_id').value;
          const idOrigen = document.getElementById('solicitud_id_origen').value;
          
          const solicitudData = {
            texto_fundamentos: texto,
            contribuyente_id: null // Siempre anónimo por ahora
          };
          
          // Agregar identificadores según corresponda
          if (hechoId) {
            solicitudData.hecho_id = parseInt(hechoId);
          } else if (fuenteId && idOrigen) {
            solicitudData.fuente_id = parseInt(fuenteId);
            solicitudData.id_origen = parseInt(idOrigen);
          }
          
          try {
            const response = await fetch('http://localhost:8084/api/solicitudes', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(solicitudData)
            });
            
            const responseData = await response.text();
            
            // Resetear botón siempre (tanto en éxito como en error)
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar Solicitud';
            
            if (response.ok) {
              // Éxito - mostrar toast y cerrar modal
              showToast('Solicitud de eliminación enviada exitosamente. Será revisada por los administradores.', 'success');
              closeSolicitudEliminacionModal();
            } else {
              // Error - mostrar toast y mantener modal abierto
              const errorMessage = responseData || 'Error al enviar la solicitud. Por favor, intente nuevamente.';
              showToast(errorMessage, 'error');
              
              // Solo mostrar error en el formulario si NO es spam (el toast ya lo muestra)
              if (!errorMessage.includes('Spam detectado')) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = errorMessage;
              }
            }
          } catch (error) {
            // Error de conexión - resetear botón, mostrar toast y mantener modal abierto
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar Solicitud';
            const errorMessage = 'Error de conexión: ' + error.message;
            showToast(errorMessage, 'error');
            errorDiv.style.display = 'block';
            errorDiv.textContent = errorMessage;
          }
        });
      }
    });

    // Cerrar modal al hacer click fuera
    document.addEventListener('DOMContentLoaded', function() {
      const modal = document.getElementById('solicitudEliminacionModal');
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) {
            closeSolicitudEliminacionModal();
          }
        });
      }
    });

    // Cerrar modal con Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('solicitudEliminacionModal');
        if (modal && modal.style.display === 'flex') {
          closeSolicitudEliminacionModal();
        }
      }
    });

    // Función para mostrar toasts
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;

      container.appendChild(toast);

      // Trigger animation
      setTimeout(() => {
        toast.classList.add('show');
      }, 10);

      // Auto remove after 3 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 300);
      }, 3000);
    }
    /*]]>*/
  </script>
  </div>
