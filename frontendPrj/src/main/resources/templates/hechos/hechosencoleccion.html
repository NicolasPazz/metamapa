<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaMapa - Hechos</title>
  <link rel="stylesheet" th:href="@{/css/landing.css}">
</head>


<html th:replace="~{layout/base :: html}">
<div th:fragment="contenido">
  <!-- Hechos in a collection -->
  <section class="hechos-block">
    <!--<h2>Colección: Derechos Humanos</h2> -->

    <form method="get" class="filters">

      <div class="filtro-fecha">
        <label for="fechaDesde">Desde:</label>
        <input type="date" id="fechaDesde" name="fecha_reporte_desde" th:value="${param.fecha_reporte_desde}">
      </div>

      <div class="filtro-fecha">
        <label for="fechaHasta">Hasta:</label>
        <input type="date" id="fechaHasta" name="fecha_reporte_hasta" th:value="${param.fecha_reporte_hasta}">
      </div>

      <select name="ubicacion">
        <option value="">Todas las ubicaciones</option> <option value="Buenos Aires" th:selected="${param.ubicacion != null and param.ubicacion[0] == 'Buenos Aires'}">Buenos Aires</option>
        <option value="Córdoba" th:selected="${param.ubicacion != null and param.ubicacion[0] == 'Córdoba'}">Córdoba</option>
        <option value="Rosario" th:selected="${param.ubicacion != null and param.ubicacion[0] == 'Rosario'}">Rosario</option>
      </select>

      <select name="categoria">
        <option value="">Todas las categorías</option>

        <option th:each="cat : ${categorias}"
                th:value="${cat}"
                th:text="${cat}"
                th:selected="${param.categoria != null and param.categoria[0] == cat}">
        </option>
      </select>

      <select name="modo">
        <option value="irrestricto" th:selected="${param.modo != null and param.modo[0] == 'irrestricto'}">Irrestricta</option>
        <option value="curado" th:selected="${param.modo != null and param.modo[0] == 'curado'}">Curada</option>
      </select>

      <button type="submit">Aplicar Filtros</button>

      <a th:href="@{/hechos}" class="btn primary">Limpiar</a>

    </form>

    <!-- Hechos list -->
    <div class="hechos-grid">
      <div th:each="hecho : ${hechos}" class="hecho-card">
        <h3 th:text="${hecho.titulo}"></h3>
        <p th:text="${hecho.descripcion}"></p>
        <a th:href="@{'#hecho' + ${hecho.id}}">Ver detalles</a>
      </div>
    </div>
  </section>

  <!-- Details panels -->
  <div th:each="hecho : ${hechos}" th:id="${'hecho' + hecho.id}" class="details-panel">
    <h3 th:text="${hecho.titulo}"></h3>
    <p th:utext="${'<strong>Ubicación:</strong>' + hecho.latitud + ', ' + hecho.longitud}"></p>
    <p th:utext="${'<strong>Multimedia:</strong>' + #lists.size(hecho.contenidoMultimedia) + ' archivos multimedia'}"></p>
    <p th:utext="${'<strong>Fuente:</strong>' + hecho.origen}"></p>
    <p th:utext="${'<strong>Fecha Acontecimiento: </strong>' + hecho.FechaDeAcontecimiento}"></p>
    <p th:utext="${'<strong>Fecha Acontecimiento: </strong>' }"></p>


    <!-- TODO: esto funciona a nivel codigo pero rompe por la cantidad de hechos. Habría que buscar la forma de paginar

    <form th:action="@{/solicitudes}" th:object="${solicitud}" method="post">
      <label th:for="${'req' + hecho.id}">Solicitud de eliminación (máx 500 caracteres)</label>
      <textarea th:field="*{textoFundamentos}" th:id="${'req' + hecho.id}" maxlength="500" placeholder="Escribe tu justificación..."></textarea>

      <input type="hidden" th:field="*{idHecho}" th:value="${hecho.id}" />

      //TODO: agregar otro input hidden para id de contribuyente

      -->

      <button type="submit">Enviar solicitud</button>
      <a href="#" class="close">Cerrar</a>
    </form>
  </div>
  </div>
</div>
</html>
