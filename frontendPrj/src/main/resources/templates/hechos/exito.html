<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Éxito | MetaMapa</title>
    <link rel="stylesheet" href="/styles/landing.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #f0f4f8; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .success-card {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: #d1e7dd; /* Verde suave */
            color: #198754; /* Verde fuerte */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">
        <i class="bi bi-check-lg"></i>
    </div>
    <h2 class="mb-3 text-dark fw-bold">¡Hecho Creado!</h2>
    <p class="text-muted mb-4">La información del suceso ha sido guardada correctamente en el sistema y ya es visible en el mapa.</p>

    <div class="d-grid gap-2">
        <a href="/hechos" class="btn btn-primary btn-lg">Volver a mis hechos</a>
        <a href="/hechos/mapa" class="btn btn-outline-primary">Ver en el mapa</a>
    </div>
</div>

</body>
</html>
