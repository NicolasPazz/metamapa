<!DOCTYPE html>
<html lang="es" th:replace="~{layout/base :: html}">
<div th:fragment="contenido">
  <link rel="stylesheet" th:href="@{/css/landing.css}">
  
  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <section class="block" style="padding: 2rem; max-width: 800px; margin: 0 auto;">
    <div class="container">
      <h2 style="color: var(--primary); margin-bottom: 1.5rem; text-align: center;">Nuevo Hecho</h2>
      
      <form id="hechoForm" enctype="multipart/form-data">
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="titulo" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Título<span style="color: #dc3545;">*</span>
          </label>
          <input type="text" 
                 class="form-control" 
                 id="titulo" 
                 name="titulo" 
                 placeholder="Ej: Inundación en Av. Corrientes" 
                 required
                 style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Ubicación <span style="color: #dc3545;">*</span>
          </label>
          <div style="display: flex; gap: 1rem; align-items: stretch;">
            <div style="flex: 1; display: flex; gap: 1rem;">
              <div style="flex: 1;">
                <input type="number" 
                       step="any" 
                       class="form-control" 
                       id="latitud" 
                       name="latitud" 
                       placeholder="Latitud" 
                       required
                       min="-90"
                       max="90"
                       style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
              </div>
              <div style="flex: 1;">
                <input type="number" 
                       step="any" 
                       class="form-control" 
                       id="longitud" 
                       name="longitud" 
                       placeholder="Longitud" 
                       required
                       min="-180"
                       max="180"
                       style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
              </div>
            </div>
            <button type="button" 
                    onclick="obtenerUbicacion()" 
                    class="btn secondary" 
                    style="padding: 0.75rem 1rem; white-space: nowrap; display: flex; align-items: center; margin-top: 0;">
              Usar mi ubicación
            </button>
          </div>
          <div id="location-status" style="margin-top: 0.5rem; font-size: 0.85rem; color: #666;">
            Ingresa coordenadas o usa el botón.
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="categoria" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Categoría <span style="color: #dc3545;">*</span>
          </label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" 
                   list="categorias-list" 
                   class="form-control" 
                   id="categoria" 
                   name="categoria" 
                   placeholder="Selecciona o escribe una nueva categoría" 
                   required
                   autocomplete="off"
                   style="flex: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
            <datalist id="categorias-list">
              <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}"></option>
            </datalist>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="fechaAcontecimiento" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Fecha y Hora<span style="color: #dc3545;">*</span>
          </label>
          <input type="datetime-local" 
                 class="form-control" 
                 id="fechaAcontecimiento" 
                 name="fechaAcontecimiento" 
                 required
                 max=""
                 style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
          <div id="fecha-error" class="error-message" style="display: none; margin-top: 0.5rem; padding: 0.5rem; background: #fee; border: 1px solid #fcc; border-radius: 4px; color: #c33;"></div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="fotos" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Evidencia multimedia
          </label>
          <input type="file" 
                 class="form-control" 
                 id="fotos" 
                 name="contenidoMultimedia" 
                 multiple 
                 accept="image/*,video/*,audio/*" 
                 onchange="previewMedia()"
                 style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;">
          <div id="preview-container" style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem;"></div>
          <small style="color: #666; font-size: 0.85rem;">Puedes seleccionar múltiples archivos (imágenes, videos o audios)</small>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="descripcion" style="display: block; margin-bottom: 0.5rem; color: var(--text); font-weight: 500;">
            Descripción Detallada <span style="color: #dc3545;">*</span>
          </label>
          <textarea class="form-control" 
                    id="descripcion" 
                    name="descripcion" 
                    rows="4" 
                    placeholder="Describe qué sucedió..."
                    required
                    style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" 
                  class="btn primary" 
                  id="submitBtn"
                  style="flex: 1; padding: 0.75rem 1.5rem;">
            Solicitar publicación
          </button>
          <a th:href="@{/}" class="btn secondary" style="padding: 0.75rem 1.5rem;">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </section>

  <script th:inline="javascript">
    /*<![CDATA[*/
    
    // Función para obtener ubicación del navegador
    function obtenerUbicacion() {
      const status = document.getElementById('location-status');
      if (!navigator.geolocation) {
        status.textContent = "La geolocalización no es soportada por tu navegador.";
        status.style.color = '#dc3545';
        return;
      }
      
      status.textContent = "Localizando...";
      status.style.color = '#666';
      
      navigator.geolocation.getCurrentPosition(
        (position) => {
          document.getElementById('latitud').value = position.coords.latitude;
          document.getElementById('longitud').value = position.coords.longitude;
          status.textContent = "¡Ubicación encontrada!";
          status.style.color = '#28a745';
        },
        () => {
          status.textContent = "No se pudo obtener la ubicación.";
          status.style.color = '#dc3545';
        }
      );
    }

    // Función para previsualizar multimedia (imágenes, videos, audios)
    function previewMedia() {
      const preview = document.getElementById('preview-container');
      const fileInput = document.getElementById('fotos');
      preview.innerHTML = "";

      if (fileInput.files) {
        Array.from(fileInput.files).forEach(file => {
          const reader = new FileReader();
          
          reader.addEventListener("load", function() {
            const fileType = file.type;
            let mediaElement;
            
            if (fileType.startsWith('image/')) {
              // Es una imagen
              mediaElement = document.createElement('img');
              mediaElement.src = this.result;
              mediaElement.style.width = '80px';
              mediaElement.style.height = '80px';
              mediaElement.style.objectFit = 'cover';
            } else if (fileType.startsWith('video/')) {
              // Es un video
              mediaElement = document.createElement('video');
              mediaElement.src = this.result;
              mediaElement.style.width = '80px';
              mediaElement.style.height = '80px';
              mediaElement.style.objectFit = 'cover';
              mediaElement.controls = false;
              mediaElement.muted = true;
            } else if (fileType.startsWith('audio/')) {
              // Es un audio
              mediaElement = document.createElement('div');
              mediaElement.style.width = '80px';
              mediaElement.style.height = '80px';
              mediaElement.style.display = 'flex';
              mediaElement.style.alignItems = 'center';
              mediaElement.style.justifyContent = 'center';
              mediaElement.style.background = '#f0f0f0';
              mediaElement.style.borderRadius = '8px';
              mediaElement.style.border = '2px solid #ddd';
              mediaElement.innerHTML = '🎵';
              mediaElement.title = file.name;
            } else {
              // Tipo no soportado
              return;
            }
            
            if (mediaElement.tagName !== 'DIV') {
              mediaElement.style.borderRadius = '8px';
              mediaElement.style.border = '2px solid #ddd';
              mediaElement.title = file.name;
            }
            
            preview.appendChild(mediaElement);
          });
          
          reader.readAsDataURL(file);
        });
      }
    }

    // Función para mostrar toasts
    function showToast(message, type = 'info') {
      return new Promise((resolve) => {
        const container = document.getElementById('toastContainer');
        if (!container) {
          resolve();
          return;
        }

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.textContent = message;

        container.appendChild(toast);

        setTimeout(() => {
          toast.classList.add('show');
        }, 10);

        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => {
            if (toast.parentNode) {
              toast.parentNode.removeChild(toast);
            }
            resolve();
          }, 300);
        }, 3000);
      });
    }

    // Validar fecha y hora
    function validarFechaHora() {
      const fechaInput = document.getElementById('fechaAcontecimiento');
      const errorDiv = document.getElementById('fecha-error');
      const fechaValue = fechaInput.value;

      if (!fechaValue) {
        errorDiv.style.display = 'none';
        return true;
      }

      const fecha = new Date(fechaValue);
      const ahora = new Date();

      if (isNaN(fecha.getTime())) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'La fecha y hora ingresadas no son válidas.';
        errorDiv.style.color = '#dc3545';
        return false;
      }

      if (fecha > ahora) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'La fecha y hora no pueden ser futuras.';
        errorDiv.style.color = '#dc3545';
        return false;
      }

      errorDiv.style.display = 'none';
      return true;
    }

    // Event listener para validar fecha en tiempo real
    document.addEventListener('DOMContentLoaded', function() {
      const fechaInput = document.getElementById('fechaAcontecimiento');
      if (fechaInput) {
        // Establecer fecha máxima como ahora
        const ahora = new Date();
        const fechaMax = ahora.toISOString().slice(0, 16);
        fechaInput.setAttribute('max', fechaMax);
        
        fechaInput.addEventListener('change', validarFechaHora);
        fechaInput.addEventListener('blur', validarFechaHora);
      }

      // Manejar envío del formulario
      const form = document.getElementById('hechoForm');
      const submitBtn = document.getElementById('submitBtn');

      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();

          // Validar fecha antes de enviar
          if (!validarFechaHora()) {
            showToast('Por favor, corrige la fecha y hora antes de continuar.', 'error');
            return;
          }

          // Deshabilitar botón durante el envío
          submitBtn.disabled = true;
          submitBtn.textContent = 'Enviando...';

          // Crear FormData
          const formData = new FormData(form);
          
          // La fecha datetime-local ya viene en formato correcto para Spring
          // No necesitamos convertirla, Spring la parsea automáticamente

          try {
            const response = await fetch('/hechos/crear', {
              method: 'POST',
              body: formData
            });

            // Resetear botón
            submitBtn.disabled = false;
            submitBtn.textContent = 'Publicar Hecho';

            if (response.ok) {
              showToast('Solicitud de publicación de hecho creado exitosamente. Será revisado por los administradores.', 'success').then(() => {
                window.history.back();
              });
            } else {
              const errorText = await response.text();
              showToast(errorText || 'Error al crear el hecho. Por favor, intente nuevamente.', 'error');
            }
          } catch (error) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Publicar Hecho';
            showToast('Error de conexión: ' + error.message, 'error');
          }
        });
      }
    });
    /*]]>*/
  </script>
</div>
</html>
