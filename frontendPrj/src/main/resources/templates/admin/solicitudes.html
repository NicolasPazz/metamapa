<!DOCTYPE html>
<html lang="es" th:replace="~{layout/base :: html}">
<head>
    <title>Listado de Solicitudes</title>
</head>
<body>

<div th:fragment="contenido">
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Panel de Solicitudes (Total: <span th:text="${solicitudes.size()}">0</span>)</h2>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Tipo</th>
                        <th>Hecho Relacionado</th>
                        <th>Usuario</th>
                        <th>Estado</th>
                        <th class="text-end">Detalles</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="sol : ${solicitudes}">
                        <td th:text="${sol.id}">1</td>
                        <td th:text="${#temporals.format(sol.fechaDeCargaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>

                        <td th:text="${sol.tipo}">TIPO</td>

                        <td>
                            <span th:if="${sol.hecho != null}" th:text="${sol.hecho.titulo}">Título</span>
                            <span th:if="${sol.hecho == null}" class="text-muted fst-italic">Hecho desconocido</span>
                        </td>

                        <td th:text="${sol.contribuyenteId != null ? sol.contribuyenteId : 'Anónimo'}">User</td>

                        <td th:text="${sol.estado}">ESTADO</td>
<!--

                        <td class="text-end">
                            <button class="btn btn-sm btn-info text-white"
                                    th:onclick="verDetalle([[${sol}]])">
                                Ver info
                            </button>
                        </td>
-->
                    </tr>

                    <tr th:if="${#lists.isEmpty(solicitudes)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            No hay solicitudes registradas en el sistema.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalle de Solicitud #<span id="modalId"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <strong>Tipo:</strong> <span id="modalTipo"></span><br>
                        <strong>Estado:</strong> <span id="modalEstado"></span>
                    </div>

                    <div class="card bg-light">
                        <div class="card-body">
                            <h6>Contenido / Justificación:</h6>
                            <pre id="modalContenido" style="white-space: pre-wrap; font-size: 0.9em;"></pre>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let modal = null;

        document.addEventListener('DOMContentLoaded', function() {
            modal = new bootstrap.Modal(document.getElementById('modalDetalle'));
        });

        function verDetalle(solicitud) {
            // Llenar datos básicos
            document.getElementById('modalId').textContent = solicitud.id;
            document.getElementById('modalTipo').textContent = solicitud.tipo;
            document.getElementById('modalEstado').textContent = solicitud.estado;

            // Formatear el contenido (detalle)
            const contenidoDiv = document.getElementById('modalContenido');

            if (!solicitud.detalle) {
                contenidoDiv.textContent = "Sin detalles adicionales.";
            } else {
                // Intentamos ver si es un JSON (caso Edición) para mostrarlo bonito
                try {
                    const json = JSON.parse(solicitud.detalle);
                    // Lo mostramos indentado
                    contenidoDiv.textContent = JSON.stringify(json, null, 2);
                } catch (e) {
                    // Si no es JSON (caso Eliminación con texto plano), mostramos el texto tal cual
                    contenidoDiv.textContent = solicitud.detalle;
                }
            }

            modal.show();
        }
    </script>
</div>

</body>
</html>
