spring.application.name=frontendPrj
server.port=8080

# Custom properties
# Paginacion
app.pagination.page-size=18

# URLs de servicios backend
app.api.agregador.base-url=http://localhost:8084/api
app.api.dinamica.base-url=http://localhost:8081/api
app.api.estatica.base-url=http://localhost:8082/api

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.http.codecs.max-in-memory-size=10MB

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.frontend=INFO
logging.level.org.springframework.web=INFO
