spring.application.name=proxy_metamapa
server.port=${PORT:8086}

# Custom properties
# URL para conectarse a otra instancia de MetaMapa (solo para prod-metamapa-external)
# Actualmente no se usa - se usa stub en todos los ambientes
metamapa.external.url=${METAMAPA_EXTERNAL_URL}/api

# Perfiles de Spring
# Se configura mediante SPRING_PROFILES_ACTIVE en variables de entorno
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.proxy_metamapa=INFO
logging.level.org.springframework.web=INFO

# Configuracion de Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Configuracion de seguridad
# En desarrollo local (docker-compose.yml) se desactiva mediante SECURITY_ORIGIN_FILTER_ENABLED=false
security.origin-filter.enabled=${SECURITY_ORIGIN_FILTER_ENABLED:true}
