# Configuracion para despliegue en AWS - Proxy MetaMapa
spring.application.name=proxy_metamapa
server.port=${PORT:8086}

# URL del servicio de agregador de la instancia propia
agregador.url=${AGREGADOR_URL:http://agregador-service:8084}/api

# Desactivar perfil de desarrollo en produccion
# spring.profiles.active=dev

# Logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.proxy_metamapa=INFO
logging.level.org.springframework.web=WARN

