spring.application.name=proxy_ong
server.port=${PORT:8083}

# Custom properties
# Para activar el perfil de desarrollo (limita a 1 pagina de hechos) descomentar la linea siguiente
# spring.profiles.active=dev

proxy_ong.auth.email=${PROXY_ONG_EMAIL:{{ddsi_email}}}
proxy_ong.auth.password=${PROXY_ONG_PASSWORD:{{ddsi_password}}}
proxy_ong.api.url=${PROXY_ONG_API_URL:https://api-ddsi.disilab.ar/public/api}

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:proxy_ong}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de HikariCP - Pool reducido para evitar "Too many connections"
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.proxy_ong=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
