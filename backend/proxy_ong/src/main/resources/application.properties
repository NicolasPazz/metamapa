spring.application.name=proxy_ong
server.port=8083

# Custom properties
# Para activar el perfil de desarrollo (limita a 1 pagina de hechos) descomentar la linea siguiente
#
spring.profiles.active=dev

proxy_ong.auth.email={{ddsi_email}}
proxy_ong.auth.password={{ddsi_password}}
proxy_ong.api.url=https://api-ddsi.disilab.ar/public/api

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/proxy_ong?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.proxy_ong=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
