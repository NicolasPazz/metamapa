# Configuracion para despliegue en AWS - Proxy ONG
spring.application.name=proxy_ong
server.port=${PORT:8083}

# Desactivar perfil de desarrollo en produccion
# spring.profiles.active=dev

proxy_ong.auth.email=${PROXY_ONG_EMAIL:{{ddsi_email}}}
proxy_ong.auth.password=${PROXY_ONG_PASSWORD}
proxy_ong.api.url=${PROXY_ONG_API_URL:https://api-ddsi.disilab.ar/public/api}

# Configuracion de la base de datos (usar RDS en AWS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:proxy_ong}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
# En produccion usar: validate o update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.proxy_ong=INFO
logging.level.org.springframework.web=WARN

