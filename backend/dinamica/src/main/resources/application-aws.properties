# Configuracion para despliegue en AWS - Dinamica
spring.application.name=dinamica
server.port=${PORT:8081}

# Custom properties (used via @CrossOrigin in controllers)
frontend.url=${FRONTEND_URL:http://frontend-service:8080}

# Configuracion de la base de datos (usar RDS en AWS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dinamica}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
# En produccion usar: validate o update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de almacenamiento de multimedia (usar S3 o EFS en AWS)
# Carpeta compartida entre dinamica (guarda) y agregador (consume)
# En AWS usar EFS o S3 para compartir entre servicios
multimedia.storage.path=${MULTIMEDIA_STORAGE_PATH:/app/shared-data/multimedia}

# Configuracion de tamaño maximo de archivo (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configuracion de logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.dinamica=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

