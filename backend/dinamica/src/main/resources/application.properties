spring.application.name=dinamica
server.port=8081

app.base-url=http://localhost:8081/api
frontend.url=http://localhost:5173

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/dinamica?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.dinamica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
