spring.application.name=dinamica
server.port=${PORT:8081}

# Custom properties
frontend.url=${FRONTEND_URL:http://localhost:5173}
agregador.url=${AGREGADOR_URL:http://localhost:8084}

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dinamica}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de almacenamiento de multimedia
# Carpeta compartida entre dinamica (guarda) y agregador (consume)
multimedia.storage.path=${MULTIMEDIA_STORAGE_PATH:backend/data/multimedia}

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.dinamica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
