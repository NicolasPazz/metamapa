spring.application.name=dinamica
server.port=8081

# Custom properties
frontend.url=http://localhost:5173

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/dinamica?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de almacenamiento de multimedia
# Carpeta compartida entre dinamica (guarda) y agregador (consume)
multimedia.storage.path=backend/data/multimedia

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configuracion de tamano maximo del request body JSON
spring.http.encoding.charset=UTF-8
server.max-http-header-size=64KB
server.max-http-post-size=10MB
spring.http.codecs.max-in-memory-size=50MB

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.dinamica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
