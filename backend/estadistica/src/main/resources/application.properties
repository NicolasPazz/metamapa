spring.application.name=estadistica
server.port=${PORT:8085}

# Custom properties
agregador.base-url=${AGREGADOR_URL:http://localhost:8084}/api

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:estadisticas}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de HikariCP - Pool reducido para evitar "Too many connections"
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.estadistica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
