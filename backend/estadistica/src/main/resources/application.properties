spring.application.name=estadistica
server.port=${PORT:8085}

# Custom properties
agregador.base-url=${AGREGADOR_URL}/api

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=${DB_USE_SSL}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de HikariCP - Pool reducido para evitar "Too many connections"
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.tool.schema.ignore_errors=true

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.estadistica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Configuracion de Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Configuracion de seguridad
# En desarrollo local (docker-compose.yml) se desactiva mediante SECURITY_ORIGIN_FILTER_ENABLED=false
security.origin-filter.enabled=${SECURITY_ORIGIN_FILTER_ENABLED:true}
