# Configuracion para despliegue en AWS - Users
spring.application.name=users
server.port=${PORT:8087}

# Configuracion de la base de datos (usar RDS en AWS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:users}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
# En produccion usar: validate o update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.users=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
