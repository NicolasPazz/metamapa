# Configuracion para despliegue en AWS - Estatica
spring.application.name=estatica
server.port=${PORT:8082}

# Configuracion de la base de datos (usar RDS en AWS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:estatica}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
# En produccion usar: validate o update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuracion de archivos CSV (usar S3 o EFS en AWS)
csv.storage.path=${CSV_STORAGE_PATH:/app/shared-data/csv}

# Configuracion de tamaño maximo de archivo (5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.estatica=INFO
logging.level.org.springframework.web=WARN

