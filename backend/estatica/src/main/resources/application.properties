spring.application.name=estatica
server.port=8082

# Configuraci�n de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/estatica?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci�n de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuraci�n de archivos CSV
csv.storage.path=backend/data/csv

# Configuraci�n de tama�o m�ximo de archivo (5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

