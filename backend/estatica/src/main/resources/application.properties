spring.application.name=estatica
server.port=8082

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/estatica?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de archivos CSV
csv.storage.path=backend/data/csv

# Configuracion de tamano maximo de archivo
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.estatica=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
