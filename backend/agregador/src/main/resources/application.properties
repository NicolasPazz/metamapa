spring.application.name=agregador
server.port=${PORT:8084}

# Custom properties
users.base-url=${USERS_SERVICE_URL}/api/users

# URLs de las fuentes
# ESTATICAS
fuentes.config[0].id=0
fuentes.config[0].nombre=Fuente Est\u00E1tica
fuentes.config[0].url=${ESTATICA_URL}/api
fuentes.config[0].tipo=CRON

# DINAMICAS
fuentes.config[1].id=1
fuentes.config[1].nombre=Fuente Din\u00E1mica
fuentes.config[1].url=${DINAMICA_URL}/api
fuentes.config[1].tipo=CRON

# ONGs
fuentes.config[2].id=2
fuentes.config[2].nombre=Fuente Proxy ONG
fuentes.config[2].url=${PROXY_ONG_URL}/api
fuentes.config[2].tipo=CRON

# METAMAPA
fuentes.config[3].id=3
fuentes.config[3].nombre=Fuente Proxy MetaMapa
fuentes.config[3].url=${PROXY_METAMAPA_URL}/api
fuentes.config[3].tipo=TIEMPO_REAL

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=${DB_USE_SSL}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de HikariCP - Pool optimizado para mejor performance
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.tool.schema.ignore_errors=true

# Multimedia: se obtiene desde dinamica por HTTP (DINAMICA_URL)

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.agregador=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Configuracion de Actuator (Health Check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Configuracion de seguridad
# En desarrollo local (docker-compose.yml) se desactiva mediante SECURITY_ORIGIN_FILTER_ENABLED=false
security.origin-filter.enabled=${SECURITY_ORIGIN_FILTER_ENABLED:true}
