spring.application.name=agregador
server.port=8084

estadisticas.base-url=http://localhost:8085/api/estadisticas

# URLs de las fuentes
# ESTATICAS
fuentes.config[0].url=http://localhost:8082/api
fuentes.config[0].tipo=CRON

# DINAMICAS
fuentes.config[1].url=http://localhost:8081/api
fuentes.config[1].tipo=CRON

# ONGs
fuentes.config[2].url=http://localhost:8083/api
fuentes.config[2].tipo=CRON

# METAMAPA
fuentes.config[3].url=http://localhost:8086/api
fuentes.config[3].tipo=TIEMPO_REAL

# Cantidades maximas de hechos por fuente y fuentes
idgenerator.maxFuentes=100
idgenerator.maxHechosPorFuente=100000

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/ddsi_2025_mi_proservices?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de sincronización de entities contra la base de datos
spring.jpa.hibernate.ddl-auto=create
# none: no toca la BD.
# validate: valida que las entidades coincidan con la BD.
# update: actualiza la BD según las entidades (muy usado en desarrollo).
# create: crea las tablas en cada inicio.
# create-drop: igual que create pero borra al apagar.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.web=DEBUG