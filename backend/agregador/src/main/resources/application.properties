spring.application.name=agregador
server.port=8084

users.base-url=http://localhost:8087/api/users

# URLs de las fuentes
# ESTATICAS
fuentes.config[0].id=0
fuentes.config[0].nombre=Fuente Est\u00E1tica
fuentes.config[0].url=http://localhost:8082/api
fuentes.config[0].tipo=CRON

# DINAMICAS
fuentes.config[1].id=1
fuentes.config[1].nombre=Fuente Din\u00E1mica
fuentes.config[1].url=http://localhost:8081/api
fuentes.config[1].tipo=CRON

# ONGs
fuentes.config[2].id=2
fuentes.config[2].nombre=Fuente Proxy ONG
fuentes.config[2].url=http://localhost:8083/api
fuentes.config[2].tipo=CRON

# METAMAPA
fuentes.config[3].id=3
fuentes.config[3].nombre=Fuente Proxy MetaMapa
fuentes.config[3].url=http://localhost:8086/api
fuentes.config[3].tipo=TIEMPO_REAL

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/agregador?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de sincronizacion de entities contra la base de datos
spring.jpa.hibernate.ddl-auto=create
# none: no toca la BD.
# validate: valida que las entidades coincidan con la BD.
# update: actualiza la BD seguon las entidades (muy usado en desarrollo).
# create: crea las tablas en cada inicio.
# create-drop: igual que create pero borra al apagar.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.HttpLogging=WARN

# Configuracion de almacenamiento de multimedia
# Carpeta compartida entre dinamica (guarda) y agregador (consume)
multimedia.storage.path=backend/data/multimedia
