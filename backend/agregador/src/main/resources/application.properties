spring.application.name=agregador
server.port=${PORT:8084}

# Custom properties
users.base-url=${USERS_SERVICE_URL:http://localhost:8087}/api/users

# URLs de las fuentes
# ESTATICAS
fuentes.config[0].id=0
fuentes.config[0].nombre=Fuente Est\u00E1tica
fuentes.config[0].url=${ESTATICA_URL:http://localhost:8082}/api
fuentes.config[0].tipo=CRON

# DINAMICAS
fuentes.config[1].id=1
fuentes.config[1].nombre=Fuente Din\u00E1mica
fuentes.config[1].url=${DINAMICA_URL:http://localhost:8081}/api
fuentes.config[1].tipo=CRON

# ONGs
fuentes.config[2].id=2
fuentes.config[2].nombre=Fuente Proxy ONG
fuentes.config[2].url=${PROXY_ONG_URL:http://localhost:8083}/api
fuentes.config[2].tipo=CRON

# METAMAPA
fuentes.config[3].id=3
fuentes.config[3].nombre=Fuente Proxy MetaMapa
fuentes.config[3].url=${PROXY_METAMAPA_URL:http://localhost:8086}/api
fuentes.config[3].tipo=TIEMPO_REAL

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agregador}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de almacenamiento de multimedia
# Carpeta compartida entre dinamica (guarda) y agregador (consume)
multimedia.storage.path=${MULTIMEDIA_STORAGE_PATH:backend/data/multimedia}

# Configuracion de logging
logging.level.ar.utn.ba.ddsi.agregador=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
