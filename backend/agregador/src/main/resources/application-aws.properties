# Configuracion para despliegue en AWS - Agregador
spring.application.name=agregador
server.port=${PORT:8084}

users.base-url=${USERS_SERVICE_URL:http://users-service:8087}/api/users

# URLs de las fuentes
# ESTATICAS
fuentes.config[0].id=0
fuentes.config[0].nombre=Fuente Estatica
fuentes.config[0].url=${ESTATICA_URL:http://estatica-service:8082}/api
fuentes.config[0].tipo=CRON

# DINAMICAS
fuentes.config[1].id=1
fuentes.config[1].nombre=Fuente Dinamica
fuentes.config[1].url=${DINAMICA_URL:http://dinamica-service:8081}/api
fuentes.config[1].tipo=CRON

# ONGs
fuentes.config[2].id=2
fuentes.config[2].nombre=Fuente Proxy ONG
fuentes.config[2].url=${PROXY_ONG_URL:http://proxy-ong-service:8083}/api
fuentes.config[2].tipo=CRON

# METAMAPA
fuentes.config[3].id=3
fuentes.config[3].nombre=Fuente Proxy MetaMapa
fuentes.config[3].url=${PROXY_METAMAPA_URL:http://proxy-metamapa-service:8086}/api
fuentes.config[3].tipo=TIEMPO_REAL

# Configuracion de la base de datos (usar RDS en AWS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agregador}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de sincronizacion de entities contra la base de datos
# En produccion usar: validate o update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuracion de almacenamiento de multimedia (usar S3 o EFS en AWS)
# Carpeta compartida entre dinamica (guarda) y agregador (consume)
# En AWS usar EFS o S3 para compartir entre servicios
multimedia.storage.path=${MULTIMEDIA_STORAGE_PATH:/app/shared-data/multimedia}

# Logging para produccion
logging.level.root=INFO
logging.level.ar.utn.ba.ddsi.agregador=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

